<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Recipe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <div class="container mt-5">
    <h2>Create a New Recipe</h2>

    <!-- Show error message if any -->
    <div th:if="${error}" class="alert alert-danger">
      <p th:text="${error}"></p>
    </div>

    <form th:action="@{/recipes/create}" method="post">
      <!-- Recipe Name -->
      <div class="mb-3">
        <label for="name" class="form-label">Recipe Name</label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>

      <!-- Recipe Image URL -->
      <div class="mb-3">
        <label for="image" class="form-label">Image URL</label>
        <input type="text" class="form-control" id="image" name="image" required>
      </div>

      <!-- Video URL -->
      <div class="mb-3">
        <label for="videoUrl" class="form-label">Video URL</label>
        <input type="text" class="form-control" id="videoUrl" name="videoUrl" required>
      </div>

      <!-- Meal Type -->
      <div class="mb-3">
        <label for="mealType" class="form-label">Meal Type</label>
        <select id="mealType" name="mealType" class="form-select" required>
          <option value="BREAKFAST">Breakfast</option>
          <option value="LUNCH">Lunch</option>
          <option value="DINNER">Dinner</option>
        </select>
      </div>

      <!-- Ingredients -->
      <div id="ingredients-container" class="mb-3">
        <label for="ingredients" class="form-label">Ingredients</label>
        <div class="ingredient-row">
          <input type="text" class="form-control" name="ingredients[]" placeholder="Ingredient Name" required>
          <input type="text" class="form-control mt-2" name="quantities[]" placeholder="Quantity" required>
        </div>
      </div>
      <button type="button" class="btn btn-secondary mt-2" onclick="addIngredient()">Add Ingredient</button>

      <!-- Difficulty -->
      <div class="mb-3">
        <label for="difficulty" class="form-label">Difficulty</label>
        <select id="difficulty" name="difficulty" class="form-select" required>
          <option value="EASY">Easy</option>
          <option value="MEDIUM">Medium</option>
          <option value="HARD">Hard</option>
        </select>
      </div>

      <!-- Instructions -->
      <div class="mb-3">
        <label for="instructions" class="form-label">Instructions</label>
        <textarea class="form-control" id="instructions" name="instructions" rows="4" required></textarea>
      </div>

      <!-- Country of Origin -->
      <div class="mb-3">
        <label for="countryOfOrigin" class="form-label">Country of Origin</label>
        <input type="text" class="form-control" id="countryOfOrigin" name="countryOfOrigin" required>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">Create Recipe</button>
    </form>

    <script>
      function addIngredient() {
        let container = document.getElementById("ingredients-container");
        let newIngredientRow = document.createElement("div");
        newIngredientRow.classList.add("ingredient-row");
        newIngredientRow.innerHTML = `
          <input type="text" class="form-control" name="ingredients[]" placeholder="Ingredient Name" required>
          <input type="text" class="form-control mt-2" name="quantities[]" placeholder="Quantity" required>
        `;
        container.appendChild(newIngredientRow);
      }
    </script>


</body>

</html>
