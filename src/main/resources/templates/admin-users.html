<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Users</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <div class="container my-5">
    <div class="row">
      <div class="col-12">
        <div class="d-flex justify-content-end mb-4 align-items-center">
          <div class="me-2">
            <a href="/recipes" class="btn btn-secondary"><i class="fa-solid fa-house"></i> Back to Recipes</a>
          </div>

          <div th:if="${session.token != null}" class="me-2">
            <a href="/recipes/create" class="btn btn-secondary"><i class="fa-solid fa-plus"></i> Add Recipe</a>
          </div>

          <div th:if="${session.token != null}">
            <a href="/logout" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="container mt-4">
        <h2 class="display-4 mb-4 text-start">Admin Users</h2>
        <div class="d-flex justify-content-end">
          <button type="button" class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#userModal">
            <i class="fa-solid fa-user-plus"></i> Add User
          </button>
        </div>
        <div class="card mt-4 p-3">

          <div class="table-responsive">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th scope="col">Username</th>
                  <th scope="col">Email</th>
                  <th scope="col">Role</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="user : ${users}">
                  <td th:text="${user.username}"></td>
                  <td th:text="${user.email}"></td>
                  <td>
                    <div th:if="${user.role == 'ADMIN'}" class="d-flex align-content-center">
                      <span class="badge bg-success">Admin</span>
                    </div>
                    <div th:if="${user.role == 'USER'}">
                      <span class="badge bg-secondary">User</span>
                    </div>
                  </td>
                  <td>
                    <div class="d-flex">
                      <div class="">
                        <button type="button" class="btn btn-primary btn-sm me-3" data-bs-toggle="modal"
                          data-bs-target="#userModal" th:data-bs-id="${user.userId}"
                          th:data-bs-username="${user.username}" th:data-bs-email="${user.email}"
                          th:data-bs-role="${user.role}">
                          <i class="fas fa-edit"></i> Edit
                        </button>
                      </div>

                      <form th:action="@{/admin/users/{id}(id=${user.userId})}" method="post">
                        <input type="hidden" name="_method" value="DELETE" />
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this user?');"
                          class="btn btn-danger btn-sm"><i class="fas fa-trash"></i> Delete</button>
                      </form>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="userModalLabel" th:text="${user != null} ? 'Edit User' : 'Create User'"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Form inside the modal -->

          <form th:action="@{${user != null} ? '/admin/users' : '/admin/users'}" method="post" id="userForm">

            <!-- Dynamically set _method to PUT if user exists (for editing) -->
            <input type="hidden" name="_method" th:value="${user != null} ? 'PUT' : 'POST'">

            <!-- Hidden input to store userId for editing -->
            <input type="hidden" id="userId" name="userId" th:value="${user != null} ? ${user.userId} : ''">

            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" name="username"
                th:value="${user != null} ? ${user.username} : ''" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" name="email"
                th:value="${user != null} ? ${user.email} : ''" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password">
            </div>
            <div class="mb-3">
              <label for="role" class="form-label">Role</label>
              <select class="form-select" id="role" name="role" required>
                <option value="USER" th:selected="${user != null && user.role == 'USER'}">User</option>
                <option value="ADMIN" th:selected="${user != null && user.role == 'ADMIN'}">Admin</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </div>

</body>

<script>
  const userModal = document.getElementById('userModal');
  userModal.addEventListener('show.bs.modal', function (event) {
    const button = event.relatedTarget;

    const userId = button.getAttribute('data-bs-id');
    const username = button.getAttribute('data-bs-username');
    const email = button.getAttribute('data-bs-email');
    const role = button.getAttribute('data-bs-role');

    const userIdField = document.getElementById('userId');
    const usernameField = document.getElementById('username');
    const emailField = document.getElementById('email');
    const roleField = document.getElementById('role');

    if (userId) {
      userIdField.value = userId;
      usernameField.value = username;
      emailField.value = email;
      roleField.value = role;

      document.getElementById('userModalLabel').textContent = "Edit User";
    } else {
      userIdField.value = '';
      usernameField.value = '';
      emailField.value = '';
      roleField.value = 'USER';

      document.getElementById('userModalLabel').textContent = "Create User";
    }
  });
</script>
